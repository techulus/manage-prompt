<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ManagePrompt</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/apply-settings.js"></script>
</head>
<body>
    {{template "header" .}}
    <div class="sub-header">
        <div class="sub-header-left">
            <span class="badge" id="connection-status">connecting</span>
            <div class="stats" id="stats"></div>
        </div>
        <div class="sub-header-right">
            <button class="btn btn-danger" id="clear-btn">clear</button>
        </div>
    </div>
    <main>
        <table id="request-table">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Provider / Model</th>
                    <th>Status</th>
                    <th>Latency</th>
                    <th>Tokens</th>
                    <th>Cost</th>
                </tr>
            </thead>
            <tbody id="request-list"></tbody>
        </table>
        <div id="empty-state" class="empty-state">
            <p>No requests captured yet</p>
            <p class="muted">See the <a href="https://github.com/techulus/manage-prompt#integration" target="_blank">docs</a> for integration instructions</p>
        </div>
        <div class="pagination" id="pagination"></div>
    </main>
    <script src="/static/js/app.js"></script>
</body>
</html>
