version: 2

builds:
  - main: ./cmd/manageprompt
    binary: manageprompt
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

brews:
  - repository:
      owner: techulus
      name: homebrew-tap
    homepage: https://github.com/techulus/manage-prompt
    description: Local LLM call debugger
    install: |
      bin.install "manageprompt"

changelog:
  sort: asc
